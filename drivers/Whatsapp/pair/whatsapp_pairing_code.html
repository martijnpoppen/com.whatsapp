<style>
    @import "/css/deprecated-pincode.css";

    .__private__homey-pincode {
        display: flex;
        min-height: 100%;
    }

    .__private__homey-pincode__form {
        display: grid;
        grid-template-rows: 2fr 1fr;
        min-height: 100%;
    }

    .__private__homey-pincode__code-wrapper {
        display: grid;
        align-items: center;
    }

    .__private__homey-pincode__code {
        margin-top: auto;
        margin-bottom: auto;
    }

    .__private__homey-pincode__button-wrapper {
        display: flex;
        align-items: flex-end;
    }

    .__private__homey-pincode__button {
        margin-top: auto;
        width: 100%;
    }

    .hidden {
        display: none;
    }
</style>
<div id="text"></div>
<div id="pairing_error" class="hidden homey-text-small-light"></div>
<div class=__private__homey-pincode id="pairing_code">
    
    <form id=homey-pincode-form class="__private__homey-pincode__form homey-form">
        <div class=__private__homey-pincode__code-wrapper>
            <div class=__private__homey-pincode__code>
                <div id=homey-pincode-input-group class=homey-form-pincode>

                </div>
            </div>
        </div>
    </form>
</div>
<script>
    (function () {
        var $text = document.querySelector('#text');
        var $error = document.querySelector('#pairing_error');
        var $group = document.querySelector('#homey-pincode-input-group');
        var $next = document.querySelector('#hy-nav-continue');

        var rendered = false;
        var pollTimer = null;

        function stopPolling() {
            if (pollTimer) {
                clearInterval(pollTimer);
                pollTimer = null;
            }
        }

        function renderCode(code) {
            if (rendered || !code) return;
            rendered = true;
            stopPolling();

            $group.innerHTML = '';

            var chars = String(code).split('');
            for (var i = 0; i < chars.length; i++) {
                if (i === 4) {
                    $group.appendChild(document.createTextNode('\u00a0\u00a0\u00a0'));
                }
                var input = document.createElement('input');
                input.disabled = true;
                input.className = 'homey-form-input';
                input.type = 'text';
                input.value = chars[i];
                $group.appendChild(input);
            }

            // The code is live now — let the user move on without waiting out
            // the 25s fallback timer.
            enableContinue();
        }

        function showError(message) {
            stopPolling();
            $group.innerHTML = '';
            if ($error) {
                $error.textContent = message || 'Pairing failed. Please close this screen and try again.';
                $error.classList.remove('hidden');
            }
            enableContinue();
        }

        var continueEnabled = false;

        function enableContinue() {
            continueEnabled = true;
            if (!$next) return;
            $next.classList.remove('is-loading');
            $next.classList.remove('is-disabled');
            $next.classList.remove('no-click');
        }

        function disableContinue() {
            // The code can arrive before this runs (the pull below fires
            // immediately). Never re-disable a button we already unlocked.
            if (continueEnabled || !$next) return;
            $next.classList += ' hy-button-primary hy-button-fill button is-loading is-disabled no-click';
        }

        // Push path: only lands if this view was already mounted when the code
        // arrived.
        Homey.on('code', renderCode);
        Homey.on('pair_error', showError);

        // Pull path: this is the reliable one. session.emit() on the driver is
        // fire-and-forget with no buffering, so a code produced while this view
        // was still loading is lost. Ask for it ourselves until we have it.
        function poll() {
            Homey.emit('get_pairing_code', null, function (err, result) {
                if (err || !result) return;
                if (result.code) return renderCode(result.code);
                if (result.error) return showError(result.error);
            });
        }

        poll();
        pollTimer = setInterval(poll, 1000);

        Homey.getOptions(function (err, options) {
            if (err) return Homey.error(err);

            setTimeout(function () {
                if (options.title) Homey.setTitle(Homey.__(options.title));
                if (options.text) $text.innerHTML = Homey.__(options.text);

                disableContinue();
            }, 0);

            // Fallback: never leave the user stuck behind a disabled button.
            setTimeout(enableContinue, 25000);
        });
    })();
</script>
<style>
    #pairingcode {
        font-size: 20px;
        text-align: center;
    }

    #pairing_error {
        color: var(--homey-color-red, #e5484d);
        text-align: center;
        margin-top: var(--homey-su-2, 8px);
    }

    .no-click {
        pointer-events: none
    }
</style>
